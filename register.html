<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ISSK — rejestracja</title><link rel="stylesheet" href="css/main.css"></head><body class="login-page"><main class="login-card wide"><div class="brand">ISSK</div><h1>Wniosek o konto</h1><p class="muted">Rejestracja wymaga ważnego zaproszenia administratora.</p><form id="regForm" class="grid2"><label>Imię<input id="firstName" required maxlength="50"></label><label>Nazwisko<input id="lastName" required maxlength="60"></label><label class="span2">E-mail<input id="email" type="email" required maxlength="120"></label><label>Hasło<input id="pass1" type="password" required minlength="8"></label><label>Powtórz hasło<input id="pass2" type="password" required minlength="8"></label><button class="primary span2" type="submit">Wyślij do administratora</button><p id="regMsg" class="span2"></p></form></main><script type="module" src="js/register.js"></script></body></html>
